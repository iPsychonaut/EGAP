# A/B run on the local k3d cluster "egap": same samples, same limits, different image.
#
# Samples: the three read-based E. coli rows of resources/EGAP_test.tsv
#   index 0 = Escherichia_coli-IlluminaTest   (Illumina + RefSeq)
#   index 1 = Escherichia_coli-HybridTest     (ONT + Illumina)
#   index 2 = Escherichia_coli-PacBioTest     (PacBio)
# Each Job is Indexed: one pod per sample, one sample at a time per variant, so
# egap-old and egap-new always run one pod each (7 CPU + 24Gi apiece on a
# 16-thread / 55 GB host). A failed sample does not stop the other samples.
#
# After EGAP succeeds, each pod runs final_compress.py on the sample folder
# (the pipeline itself never calls it) and prints one COMPRESS_SUMMARY line:
# old = pigz on every .fasta/.fastq, new = FASTB on nucleotide FASTA, pigz on
# the rest. The line is also saved as out/<variant>/<sample>_compress_summary.txt.
#
# Before applying:
#   copy resources\EGAP_test.tsv  ->  %USERPROFILE%\egap-ab\input\
#   push images  localhost:5050/egap:old  and  localhost:5050/egap:fastb
# Re-run: kubectl delete -f tests/ab/ab-test.yaml   (Jobs are immutable)
#
# ponytail: output lands on a Windows bind mount (slow drvfs). Move the data
# folder into the WSL filesystem if IO dominates run time.
# ponytail: KRAKEN2_DB unset, so read decontamination is skipped in both
# variants. Recreate the cluster with a /kraken2_db volume to enable it.
apiVersion: batch/v1
kind: Job
metadata:
  name: egap-old
  labels: {app: egap-ab, variant: old}
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 1
  backoffLimitPerIndex: 0         # fail once = that sample stays failed, no silent retry
  template:
    metadata:
      labels: {app: egap-ab, variant: old}
    spec:
      restartPolicy: Never
      containers:
        - name: egap
          image: egap-registry:5050/egap:old
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              samples=(Escherichia_coli-IlluminaTest Escherichia_coli-HybridTest Escherichia_coli-PacBioTest)
              sample="${samples[$JOB_COMPLETION_INDEX]}"
              awk -F'\t' -v s="$sample" 'NR==1 || $2==s' /data/input/EGAP_test.tsv > /tmp/sample.tsv
              [ "$(wc -l < /tmp/sample.tsv)" -eq 2 ] || { echo "sample $sample not found in EGAP_test.tsv" >&2; exit 1; }
              /EGAP_env/bin/EGAP --input_tsv /tmp/sample.tsv --output_dir /data/out --cpu_threads 7 --ram_gb 24
              dir="/data/out/$(awk -F'\t' 'NR==2 {print $1}' /tmp/sample.tsv)/$sample"
              before=$(du -sb "$dir" | cut -f1)
              start=$(date +%s%N)
              python /EGAP_env/bin/final_compress.py "$sample" /tmp/sample.tsv /data/out 7 24
              echo "COMPRESS_SUMMARY sample=$sample ms=$(( ($(date +%s%N) - start) / 1000000 )) bytes_before=$before bytes_after=$(du -sb "$dir" | cut -f1) fastb_files=$(find "$dir" -name '*.fastb' | wc -l) gz_files=$(find "$dir" -name '*.gz' | wc -l)" | tee "/data/out/${sample}_compress_summary.txt"
          resources:
            requests: {cpu: "7", memory: 24Gi}
            limits: {cpu: "7", memory: 24Gi}
          volumeMounts:
            - {name: data, mountPath: /data/input, subPath: input, readOnly: true}
            - {name: data, mountPath: /data/out, subPath: out/old}
      volumes:
        - name: data
          hostPath: {path: /data}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: egap-new
  labels: {app: egap-ab, variant: new}
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 1
  backoffLimitPerIndex: 0
  template:
    metadata:
      labels: {app: egap-ab, variant: new}
    spec:
      restartPolicy: Never
      containers:
        - name: egap
          image: egap-registry:5050/egap:fastb
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              samples=(Escherichia_coli-IlluminaTest Escherichia_coli-HybridTest Escherichia_coli-PacBioTest)
              sample="${samples[$JOB_COMPLETION_INDEX]}"
              awk -F'\t' -v s="$sample" 'NR==1 || $2==s' /data/input/EGAP_test.tsv > /tmp/sample.tsv
              [ "$(wc -l < /tmp/sample.tsv)" -eq 2 ] || { echo "sample $sample not found in EGAP_test.tsv" >&2; exit 1; }
              /EGAP_env/bin/EGAP --input_tsv /tmp/sample.tsv --output_dir /data/out --cpu_threads 7 --ram_gb 24
              dir="/data/out/$(awk -F'\t' 'NR==2 {print $1}' /tmp/sample.tsv)/$sample"
              before=$(du -sb "$dir" | cut -f1)
              start=$(date +%s%N)
              python /EGAP_env/bin/final_compress.py "$sample" /tmp/sample.tsv /data/out 7 24
              echo "COMPRESS_SUMMARY sample=$sample ms=$(( ($(date +%s%N) - start) / 1000000 )) bytes_before=$before bytes_after=$(du -sb "$dir" | cut -f1) fastb_files=$(find "$dir" -name '*.fastb' | wc -l) gz_files=$(find "$dir" -name '*.gz' | wc -l)" | tee "/data/out/${sample}_compress_summary.txt"
          resources:
            requests: {cpu: "7", memory: 24Gi}
            limits: {cpu: "7", memory: 24Gi}
          volumeMounts:
            - {name: data, mountPath: /data/input, subPath: input, readOnly: true}
            - {name: data, mountPath: /data/out, subPath: out/new}
      volumes:
        - name: data
          hostPath: {path: /data}
