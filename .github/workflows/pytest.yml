name: pytest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: unit (py${{ matrix.python }}, pandas ${{ matrix.pandas }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is EGAP's runtime pin (meta.yaml). 3.13 catches drift early.
        python: ["3.12", "3.13"]
        pandas: ["latest"]
        include:
          # meta.yaml's floor (pandas >=2.2, numpy >=1.26). Exercise it so
          # pandas-version-specific bugs (e.g. DataFrame.replace with pd.NA)
          # are caught in CI, not in a user's env.
          - python: "3.12"
            pandas: "2.2.0"
            numpy: "1.26.4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Pin pandas floor
        if: matrix.pandas != 'latest'
        run: python -m pip install "pandas==${{ matrix.pandas }}" "numpy==${{ matrix.numpy }}"
      - name: Run unit tests (no bioinformatics binaries required)
        run: python -m pytest tests -q --junitxml=pytest-${{ matrix.python }}-pandas${{ matrix.pandas }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-${{ matrix.python }}-pandas${{ matrix.pandas }}
          path: pytest-${{ matrix.python }}-pandas${{ matrix.pandas }}.xml

  # Opt-in job: creates the conda env and runs tests marked requires_tools.
  # Disabled by default because the EGAP_env solve is ~20 min and the runners
  # have 14 GB disk. Enable by setting the repository variable RUN_TOOL_TESTS=1.
  tools:
    name: tool-backed (conda)
    if: vars.RUN_TOOL_TESTS == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          python-version: "3.12"
          channels: conda-forge,bioconda
          channel-priority: strict
          activate-environment: EGAP_test
      # compleasm goes in with pip --no-deps: its recipe's dendropy<4.6 pin
      # cannot coexist with any py3.9+ sepp, and conda's --no-deps still
      # solves that pin. Upstream tiara (numpy<1.20) is dropped; EGAP uses
      # tiara-entheome.
      - name: Install minimal tool subset
        shell: bash -l {0}
        run: |
          mamba install -y pytest "pandas>=2.2,<3" "numpy<3" biopython matplotlib-base psutil seqkit quast hmmer miniprot sepp
          python -m pip install --no-deps "https://github.com/huangnengCSU/compleasm/archive/refs/tags/v0.2.8.tar.gz"
      - name: Run tool-backed tests
        shell: bash -l {0}
        env:
          EGAP_RUN_TOOL_TESTS: "1"
        run: python -m pytest tests -q -m requires_tools
